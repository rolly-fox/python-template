name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install deps (project + tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest black ruff

      - name: Lint (ruff)
        run: |
          python -m ruff check .

      - name: Format check (black)
        run: |
          python -m black --check .

      - name: Tests (pytest)
        run: |
          python -m pytest
