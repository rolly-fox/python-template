[project]
name = "python-template"
version = "0.1.0"
description = "Personal Python template (Cursor-ready)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
addopts = "-q"
[tool.black]
line-length = 100
[tool.ruff]
line-length = 100
target-version = "py310"
